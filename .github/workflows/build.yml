name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev build-essential git

      - name: Fetch prebuilt agbcc
        run: |
          mkdir -p tools/agbcc
          git clone https://github.com/pret/agbcc.bin.git tools/agbcc

      - name: Build tools
        run: make -C tools

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elite-Redux-Debug
          path: "*.gba"
